<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보건실 약품장 · GPT 실험실</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;color:#26354a;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:480px;margin:auto;min-height:100vh;background:#f8fbfd;padding:22px 18px 94px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.muted{color:#8290a0;font-size:12px}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px}.iconbtn{border:1px solid #e1e9ef;background:white;border-radius:13px;padding:11px}.hero{background:linear-gradient(115deg,#377dba,#5ba6bb);color:white;border-radius:23px;padding:23px;box-shadow:0 8px 20px #367eaf23}.hero h2{font-size:22px;margin:0 0 7px}.hero p{margin:0 0 20px;color:#e6f4fa;font-size:13px}.hero button{border:0;background:#fff;color:#2771a4;border-radius:12px;padding:12px 17px;font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px}.section h3{font-size:17px;margin:0}.link{border:0;background:transparent;color:#377fa9;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:white;border:1px solid #e7eef2;border-radius:17px;padding:16px}.stat small{color:#738296}.stat strong{display:block;font-size:28px;margin-top:7px}.stat.red strong{color:#df5b62}.stat.orange strong{color:#d78c35}.stat.blue strong{color:#3686bb}.stat.green strong{color:#32977e}.cab{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #e7eef2;border-radius:16px;padding:15px;margin:9px 0;width:100%;text-align:left;color:inherit}.cabicon{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:#eaf4fa;font-size:24px}.cabinfo{flex:1}.cabinfo b{display:block}.cabinfo small{color:#8491a0}.pill{font-size:11px;padding:5px 8px;border-radius:9px;background:#e9f7ef;color:#36896a}.pill.warn{background:#fff2df;color:#b97b29}.pill.exp{background:#ffebed;color:#c94e5b}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:white;border-top:1px solid #e5edf2;display:flex;padding:12px 4px max(12px,env(safe-area-inset-bottom))}.nav button{flex:1;background:none;border:0;color:#8290a0;font-size:12px}.nav button.active{color:#2478ac;font-weight:800}.nav span{display:block;font-size:22px;margin-bottom:3px}.back{background:none;border:0;color:#387eab;padding:0 0 14px;font-weight:700}.search,.field{width:100%;border:1px solid #dce7ef;background:white;border-radius:12px;padding:13px;margin:8px 0}.med{background:white;border:1px solid #e6edf2;border-radius:15px;padding:15px;margin:9px 0;display:flex;gap:12px;align-items:center}.med .details{flex:1}.med b{display:block;font-size:15px}.med small{color:#8a96a4}.med .expiry{font-size:12px;text-align:right}.med .expiry strong{display:block;margin-top:5px}.toolbar{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.chip{border:1px solid #dfe8ee;border-radius:20px;background:white;padding:8px 12px;font-size:12px}.chip.selected{background:#327fb3;color:white;border-color:#327fb3}.primary{width:100%;background:#337faf;color:white;border:0;border-radius:13px;padding:15px;font-weight:800;margin-top:12px}.secondary{width:100%;background:white;border:1px solid #d7e4ec;border-radius:13px;padding:13px;margin-top:10px;color:#397da5}.notice{background:#eef6fa;border-radius:13px;padding:13px;color:#55768c;font-size:12px;line-height:1.6;margin:15px 0}.hidden{display:none}.label{font-size:12px;color:#718294;margin-top:14px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.empty{text-align:center;padding:40px 15px;color:#8a99a7}.status{font-size:12px;color:#67879c;margin-top:10px;white-space:pre-wrap}.qr{border:2px dashed #bdd6e6;border-radius:18px;padding:24px;text-align:center;background:white;margin:20px 0}.qr span{font-size:60px}.footnote{font-size:11px;color:#96a2ae;margin-top:16px}
</style></head><body><main class="shell"><div id="app"></div></main><nav class="nav"><button onclick="go('home')" id="nav-home"><span>⌂</span>홈</button><button onclick="go('cabinets')" id="nav-cabinets"><span>▤</span>수납장</button><button onclick="go('all')" id="nav-all"><span>◫</span>약품</button><button onclick="go('settings')" id="nav-settings"><span>⚙</span>연결</button></nav><script>
const demoC=[{id:'a1',code:'A-01',name:'일반의약품',place:'1층 보건실 왼쪽'},{id:'b1',code:'B-02',name:'외용약품',place:'1층 보건실 오른쪽'},{id:'c1',code:'C-03',name:'응급처치',place:'처치대 하단'}];
function dateAfter(d){let x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()+d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}
const demoM=[{id:'1',cabinetId:'a1',name:'타이레놀정 500mg',expiry:dateAfter(24),qty:'20',unit:'정',note:''},{id:'2',cabinetId:'a1',name:'이지엔6',expiry:dateAfter(180),qty:'12',unit:'캡슐',note:''},{id:'3',cabinetId:'a1',name:'소화제',expiry:dateAfter(-8),qty:'4',unit:'포',note:''},{id:'4',cabinetId:'b1',name:'포비돈요오드',expiry:dateAfter(55),qty:'2',unit:'개',note:''},{id:'5',cabinetId:'b1',name:'항생제 연고',expiry:dateAfter(230),qty:'3',unit:'개',note:''},{id:'6',cabinetId:'c1',name:'생리식염수',expiry:dateAfter(15),qty:'6',unit:'병',note:''}];
let cabinets=structuredClone(demoC),meds=structuredClone(demoM),info=[],live=false,view='home',current='',filter='all',query='',editing='';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function days(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;let [y,m,d]=s.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCFullYear()!=y||dt.getUTCMonth()!=m-1||dt.getUTCDate()!=d)return null;let n=new Date(),today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((dt.getTime()-today)/86400000)}
function level(m){let d=days(m.expiry);return d===null?'unknown':d<0?'exp':d<=30?'warn':d<=90?'soon':'ok'}function status(m){let d=days(m.expiry);return d===null?'날짜 확인':d<0?`${-d}일 지남`:d===0?'오늘 만료':d<=90?`${d}일 남음`:'정상'}function counts(ms){return {total:ms.length,exp:ms.filter(x=>level(x)==='exp').length,warn:ms.filter(x=>level(x)==='warn').length,soon:ms.filter(x=>level(x)==='soon').length}}
function head(sub){return `<div class="top"><div><div class="muted">보건실 · MED CABINET</div><div class="brand">${sub||'약품장'} <span style="color:#66abc3">✳</span></div></div><button class="iconbtn" onclick="go('settings')">⚙</button></div>`}
function go(v,id){view=v;if(id!==undefined)current=id;filter='all';query='';render()}function nav(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.id==='nav-'+(view==='cabinet'||view==='scan'?'cabinets':view==='edit'?'all':view)))}
function render(){nav();let c=counts(meds);if(view==='home'){app.innerHTML=head()+`<div class="hero"><h2>약품장, 한눈에 확인해요</h2><p>${live?'Google Sheets 연결 데이터':'체험용 샘플 데이터'} · 수납장 ${cabinets.length}개</p><button onclick="go('scan')">▦ QR 수납장 열기 →</button></div><div class="section"><h3>오늘의 약품 현황</h3><button class="link" onclick="go('all')">전체 보기 →</button></div><div class="stats"><div class="stat red"><small>유효기간 지남</small><strong>${c.exp}<span style="font-size:13px"> 건</span></strong></div><div class="stat orange"><small>30일 이내</small><strong>${c.warn}<span style="font-size:13px"> 건</span></strong></div><div class="stat blue"><small>31~90일</small><strong>${c.soon}<span style="font-size:13px"> 건</span></strong></div><div class="stat green"><small>전체 등록 약품</small><strong>${c.total}<span style="font-size:13px"> 건</span></strong></div></div><div class="section"><h3>내 수납장</h3><button class="link" onclick="go('cabinets')">모두 보기 →</button></div>${cabinets.slice(0,4).map(cabCard).join('')}<p class="footnote">${live?'연결된 시트에서 조회한 데이터입니다.':'현재 표시된 약품은 기능 체험용 가상 데이터입니다.'}</p>`}
else if(view==='cabinets'){app.innerHTML=head('수납장')+`<div class="notice">QR 라벨에 수납장별 링크를 넣으면 해당 수납장으로 바로 이동할 수 있어요.</div>${cabinets.map(cabCard).join('')||'<div class="empty">등록된 수납장이 없습니다.</div>'}`}
else if(view==='scan'){app.innerHTML=head('QR 수납장 열기')+`<button class="back" onclick="go('home')">← 돌아가기</button><div class="qr"><span>▦</span><h3>QR 연결 체험</h3><p class="muted">아래 수납장을 선택하면 QR을 찍고 들어온 것처럼 목록을 보여줘요.</p></div>${cabinets.map(cabCard).join('')}<div class="notice">실제 카메라 스캔은 이 데모에 포함하지 않았어요. QR에는 <b>?cab=수납장ID</b> 형식의 링크를 사용할 수 있어요.</div>`}
else if(view==='cabinet'||view==='all'){let cab=cabinets.find(x=>x.id===current),list=view==='cabinet'?meds.filter(x=>x.cabinetId===current):meds;list=list.filter(m=>(filter==='all'||level(m)===filter)&&m.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(days(a.expiry)??999999)-(days(b.expiry)??999999));app.innerHTML=head(view==='cabinet'?(cab?.code+' '+cab?.name):'전체 의약품')+(view==='cabinet'?`<button class="back" onclick="go('cabinets')">← 수납장 목록</button><div class="notice">${esc(cab?.place||'위치 미등록')} · 약품 ${meds.filter(m=>m.cabinetId===current).length}건</div>`:'')+`<input class="search" placeholder="🔎 약품명 검색" value="${esc(query)}" oninput="search(this.value)"><div class="toolbar">${[['all','전체'],['exp','만료'],['warn','30일 이내'],['soon','31~90일'],['ok','정상']].map(([k,v])=>`<button class="chip ${filter===k?'selected':''}" onclick="setFilter('${k}')">${v}</button>`).join('')}</div><div id="medlist">${list.map(medCard).join('')||'<div class="empty">해당하는 의약품이 없어요.</div>'}</div><button class="primary" onclick="edit('')">+ 의약품 추가</button>`}
else if(view==='edit'){let m=meds.find(x=>x.id===editing)||{cabinetId:current||cabinets[0]?.id||'',name:'',expiry:'',qty:'',unit:'개',note:''};app.innerHTML=head(editing?'의약품 수정':'의약품 추가')+`<button class="back" onclick="go('${current?'cabinet':'all'}')">← 목록으로</button><form onsubmit="save(event)"><div class="label">약품명</div><input class="field" id="name" required value="${esc(m.name)}"><div class="label">수납장</div><select class="field" id="cab">${cabinets.map(x=>`<option value="${esc(x.id)}" ${x.id===m.cabinetId?'selected':''}>${esc(x.code+' '+x.name)}</option>`).join('')}</select><div class="label">유효기간</div><input class="field" id="expiry" type="date" required value="${esc(m.expiry)}"><div class="row"><div><div class="label">수량</div><input class="field" id="qty" type="number" min="0" step="any" value="${esc(m.qty)}"></div><div><div class="label">단위</div><input class="field" id="unit" value="${esc(m.unit)}"></div></div><div class="label">메모</div><input class="field" id="note" value="${esc(m.note)}"><button class="primary" type="submit">${live?'로컬 변경 미리보기':'샘플 데이터에 저장'}</button></form><div class="notice">안전한 비교를 위해 이 데모의 수정 내용은 Google Sheets에 전송하지 않아요. 페이지를 새로고침하면 초기화됩니다.</div>`}
else if(view==='settings'){app.innerHTML=head('데이터 연결')+`<div class="notice"><b>읽기 전용 연결 실험</b><br>Apps Script URL과 접근 키를 입력해 시트 데이터를 가져옵니다. 키는 이 페이지에 저장하지 않으며, 수정 요청은 전송하지 않습니다. 공개 웹페이지에서는 브라우저 CORS 제한으로 연결이 실패할 수 있습니다.</div><div class="label">Apps Script 웹 앱 URL</div><input class="field" id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"><div class="label">접근 키</div><input class="field" id="key" type="password" placeholder="비밀번호"><button class="primary" onclick="connect()">Google Sheets 읽기 연결</button><button class="secondary" onclick="resetDemo()">샘플 데이터로 돌아가기</button><div class="status" id="connectStatus">${live?'현재 연결된 데이터를 표시하고 있습니다.':'현재는 샘플 데이터를 사용 중입니다.'}</div><div class="notice">실제 업무 데이터와 연결할 때는 별도의 테스트용 키·시트를 권장합니다. 현재 공유한 키는 변경하세요.</div>`}}
function cabCard(c){let x=counts(meds.filter(m=>m.cabinetId===c.id));return `<button class="cab" onclick="go('cabinet','${esc(c.id)}')"><div class="cabicon">▤</div><div class="cabinfo"><b>${esc(c.code)} · ${esc(c.name)}</b><small>${esc(c.place)} · ${x.total}건</small></div><span class="pill ${x.exp?'exp':x.warn?'warn':''}">${x.exp?'만료 '+x.exp:x.warn?'임박 '+x.warn:'정상'}</span></button>`}
function medCard(m){let l=level(m);return `<div class="med" onclick="edit('${esc(m.id)}')"><div style="font-size:25px">${l==='exp'?'🔴':l==='warn'?'🟠':l==='soon'?'🔵':'💊'}</div><div class="details"><b>${esc(m.name)}</b><small>${esc(m.qty)}${esc(m.unit)} · ${esc(cabinets.find(c=>c.id===m.cabinetId)?.code||'')}</small></div><div class="expiry"><span>${esc(m.expiry)}</span><strong style="color:${l==='exp'?'#d95d64':l==='warn'?'#d38a35':l==='soon'?'#3b89ba':'#3c9b7c'}">${status(m)}</strong></div></div>`}
function search(v){query=v;render();let el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(v.length,v.length)}}function setFilter(v){filter=v;render()}function edit(id){editing=id;if(!current&&id)current=meds.find(m=>m.id===id)?.cabinetId||'';view='edit';render()}function save(e){e.preventDefault();let data={id:editing||'demo-'+Date.now(),cabinetId:document.getElementById('cab').value,name:document.getElementById('name').value.trim(),expiry:document.getElementById('expiry').value,qty:document.getElementById('qty').value,unit:document.getElementById('unit').value,note:document.getElementById('note').value};if(days(data.expiry)===null)return alert('올바른 유효기간을 입력해 주세요.');let i=meds.findIndex(x=>x.id===data.id);if(i<0)meds.push(data);else meds[i]=data;current=data.cabinetId;go('cabinet',current)}function resetDemo(){cabinets=structuredClone(demoC);meds=structuredClone(demoM);live=false;go('home')}
async function connect(){let url=document.getElementById('url').value.trim(),key=document.getElementById('key').value,status=document.getElementById('connectStatus');if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){status.textContent='올바른 Apps Script 웹 앱 URL을 입력하세요.';return}status.textContent='연결 시도 중…';try{let u=new URL(url);u.searchParams.set('action','list');u.searchParams.set('key',key);let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);let res;try{res=await fetch(u.toString(),{redirect:'follow',signal:ctl.signal})}finally{clearTimeout(timer)}let data=await res.json();if(!data.ok)throw Error(data.error||'응답 오류');if(!Array.isArray(data.cabinets)||!Array.isArray(data.meds))throw Error('데이터 형식 오류');cabinets=data.cabinets;meds=data.meds;info=data.info||[];live=true;go('home')}catch(e){status.textContent='연결 실패: '+e.message+'\nApps Script 배포 권한, URL, 비밀번호 또는 브라우저 CORS 제한을 확인하세요.'}}
let q=new URLSearchParams(location.search).get('cab');if(q){current=q;view='cabinet'}render();
</script></body></html>
